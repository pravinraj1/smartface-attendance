services:
  - type: web
    name: smartface-attendance
    runtime: docker
    plan: standard
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: STORAGE_PATH
        value: /app/storage
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: '["https://smartface-attendance-7ygu.onrender.com","http://localhost:5173","http://localhost:3000","http://127.0.0.1:5173","http://127.0.0.1:3000"]'
      - key: DOCS_ENABLED
        value: "false"
