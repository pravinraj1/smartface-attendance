services:
  - type: web
    name: smartface-attendance
    runtime: docker
    plan: standard
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: STORAGE_PATH
        value: /app/storage
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./data/smartface_attendance.db
      - key: CORS_ORIGINS
        value: '["*"]'
    disk:
      name: smartface-data
      mountPath: /app/data
      sizeGB: 1
