services:
  - type: web
    name: smartface-api
    runtime: python
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head; uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: STORAGE_PATH
        value: /data/storage
    disk:
      name: smartface-data
      mountPath: /data
      sizeGB: 1
